<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Costco Gas Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
</head>

<body>

<div class="container">

  <header>
    <h1>⛽ Costco Gas Tracker</h1>
    <div class="location">Windsor, Ontario</div>
  </header>

  <div id="error" class="error"></div>

  <div class="cards">

    <div class="card">
      <div class="label">Regular</div>

      <div>
        <span id="regularPrice" class="price">--</span>
        <span class="unit">/ L</span>
      </div>

      <div id="regularUpdated" class="updated">
        Loading...
      </div>
    </div>

    <div class="card">
      <div class="label">Premium</div>

      <div>
        <span id="premiumPrice" class="price">--</span>
        <span class="unit">/ L</span>
      </div>

      <div id="premiumUpdated" class="updated">
        Loading...
      </div>
    </div>

  </div>

  <div class="chart-card">

    <div class="chart-header">

      <div class="chart-title">
        Price History
      </div>

      <div class="range-buttons">
        <button type="button" data-range="today" class="active">Today</button>
        <button type="button" data-days="7">7D</button>
        <button type="button" data-days="30">30D</button>
        <button type="button" data-days="90">3M</button>
        <button type="button" data-days="365">1Y</button>
      </div>

    </div>

    <div class="chart-container">
      <canvas id="priceChart"></canvas>
    </div>

    <!-- Selected date information -->

    <div id="selectedDate" class="selected-date">

      <div id="selectedDateTitle" class="selected-date-title">
        Selected Date
      </div>

      <table class="selected-date-table">

        <thead>
          <tr>
            <th>Time</th>
            <th>Regular</th>
            <th>Premium</th>
          </tr>
        </thead>

        <tbody id="selectedDateBody"></tbody>

      </table>

      <div class="tap-hint">
        Tap another point on the graph to view that date.
      </div>

    </div>

  </div>

</div>
  <script src="script.js"></script>
</body>
</html>
